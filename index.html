    <meta name="theme-color" content="#1E140D" />

    <title>Our Pixel Home</title>
  </head>
  <body>
    <!-- Shown until the game's code has loaded, so a cold start never opens on a blank screen. -->
    <div id="app"><img class="preboot" src="/icons/icon-192.png" alt="" width="96" height="96" style="image-rendering: pixelated; box-shadow: 0 0 0 3px #1B1420; animation: preboot 1.2s steps(2) infinite" /></div>
    <style>#app { position: fixed; inset: 0; display: grid; place-items: center; } @keyframes preboot { 50% { opacity: .55; } }</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
